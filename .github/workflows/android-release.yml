name: Android release

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Artifact to build'
        type: choice
        options: [both, apk, aab]
        default: both
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    name: Build release
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/ogr-release.jks
            printf 'storeFile=ogr-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
            echo "Using the configured upload key."
          else
            echo "::warning::No keystore secrets configured — building a debug-signed preview. Not uploadable to Google Play."
          fi

      - name: Build APK and AAB
        working-directory: android
        run: |
          ./gradlew assembleRelease bundleRelease \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            --no-daemon

      - name: Collect artifacts
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          CODE=$(node -p "require('./app.json').expo.android.versionCode")
          mkdir -p dist/android
          cp android/app/build/outputs/apk/release/app-release.apk "dist/android/overgrowth-renaissance-$VERSION-$CODE.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/android/overgrowth-renaissance-$VERSION-$CODE.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: overgrowth-renaissance-android
          path: dist/android/*
          retention-days: 30

      - name: Attach artifacts to the tag release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/android/*
          generate_release_notes: true
